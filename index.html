<!--
  Nondiat — a personal link page, built as a letterpress calling card.
  Design method: unslop by Damir Sokolovsky, CC BY 4.0 — https://github.com/heydamir/unslop
  Direction, tokens and layout math: design/SPEC.md
  Tweaks: the palette, type and rhythm live in :root below; the seal is inline SVG at the end of <main>.
-->
<style>
:root{
  --desk:#EAE2D2;          /* table the card sits on */
  --paper:#F7F2E7;         /* the card */
  --ink:#241F19;           /* primary text, 14.6:1 on paper */
  --ink-2:#5B5245;         /* secondary text, 6.9:1 */
  --ink-3:#746A5B;         /* muted meta, 4.8:1 */
  --plum:#6B2D4F;          /* the one accent: stamp ink, 8.9:1 */
  --rule:rgba(36,31,25,.16);
  --rule-strong:rgba(36,31,25,.34);
  --wash:rgba(36,31,25,.045);
  --wash-press:rgba(36,31,25,.085);
  --ease:cubic-bezier(.22,1,.36,1);
  --serif:'Old Standard TT',Georgia,'Times New Roman','Noto Serif','DejaVu Serif',serif;
  --sans:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  padding:12px;
  min-height:100vh;
  min-height:100svh;
  background:var(--desk);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--plum);color:var(--paper)}

/* ---------- the card ---------- */
.sheet{
  display:flex;
  flex-direction:column;
  min-height:calc(100vh - 24px);
  min-height:calc(100svh - 24px);
  padding:20px 20px 16px;
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:2px;
  box-shadow:0 1px 2px rgba(36,31,25,.05),0 8px 24px rgba(36,31,25,.06);
}

/* ---------- masthead: printer's device + address ---------- */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:20px}
.device{display:block;flex:none;width:20px;height:20px;color:var(--plum)}
.masthead-url{margin:0;font-size:12px;line-height:16px;letter-spacing:.01em;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- the one column that splits on wide screens ---------- */
.column{display:flex;flex:1;flex-direction:column;min-height:0}
.identity{padding-top:44px}
.name{
  margin:0;
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(56px,18.4vw,72px);
  line-height:.95;
  letter-spacing:-.02em;
  color:var(--ink);
}
.epigraph{
  margin:12px 0 0;
  font-family:var(--serif);
  font-weight:400;
  font-size:22px;
  line-height:30px;
  letter-spacing:.005em;
  color:var(--ink-2);
}
.links{display:grid;gap:12px;margin-top:36px;max-width:480px}

/* ---------- the two doors ---------- */
.link{
  display:flex;
  align-items:center;
  gap:16px;
  min-height:64px;
  padding:12px 18px;
  border:1px solid var(--rule-strong);
  border-radius:10px;
  background-color:transparent;
  color:var(--ink);
  text-decoration:none;
  transition:background-color 150ms var(--ease),border-color 150ms var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.link:hover{background-color:var(--wash);border-color:rgba(36,31,25,.55)}
.link:active{background-color:var(--wash-press)}
.link:focus-visible{outline:2px solid var(--plum);outline-offset:3px}
.link-icon{display:block;flex:none;width:20px;height:20px;color:var(--ink-2);transition:color 150ms var(--ease)}
.link:hover .link-icon{color:var(--ink)}
.link-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.link-label{font-size:17px;line-height:21px;font-weight:500;letter-spacing:.002em}
.link-handle{font-size:12.5px;line-height:17px;font-weight:400;letter-spacing:.01em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.link-arrow{display:block;flex:none;width:14px;height:14px;margin-left:auto;color:var(--ink-3);transition:transform 150ms var(--ease),color 150ms var(--ease)}
.link:hover .link-arrow{transform:translate(2px,-2px);color:var(--ink-2)}

/* ---------- the stamp: the one bright moment ---------- */
.seal-wrap{width:min(272px,74vw);margin-top:auto;margin-left:auto;padding-top:40px}
.seal{display:block;width:100%;height:auto;color:var(--plum)}
.grape-fill{fill:var(--paper)}
.seal-type{font-family:var(--serif);font-size:18px;letter-spacing:.05em}

/* ---------- colophon ---------- */
.colophon{display:flex;justify-content:space-between;gap:16px;margin-top:20px;font-size:12px;line-height:16px;letter-spacing:.01em;color:var(--ink-3)}

/* ---------- 768 and up: the card opens into two columns ---------- */
@media (min-width:760px){
  body{padding:16px}
  .sheet{min-height:calc(100vh - 32px);min-height:calc(100svh - 32px);padding:32px 40px 24px}
  .column{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:48px;align-content:center;align-items:center}
  .identity{padding-top:0}
  .name{font-size:72px}
  .epigraph{font-size:23px}
  .links{margin-top:40px;max-width:480px}
  .seal-wrap{width:280px;margin:0;padding-top:0;justify-self:end}
}
@media (min-width:1024px){
  body{padding:24px}
  .sheet{min-height:calc(100vh - 48px);min-height:calc(100svh - 48px);padding:40px 48px 28px}
  .column{grid-template-columns:minmax(0,1fr) 360px;gap:64px;width:100%;max-width:1120px;margin:0 auto}
  .name{font-size:88px}
  .epigraph{font-size:24px;line-height:32px}
  .seal-wrap{width:360px}
}
@media (min-width:1280px){
  .column{grid-template-columns:minmax(0,1fr) 400px;gap:96px}
  .name{font-size:96px}
  .seal-wrap{width:400px}
}

/* ---------- one entrance, then stillness ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes stamp-in{from{opacity:0;transform:rotate(-7deg) scale(.98)}to{opacity:1;transform:none}}
.masthead{animation:rise 480ms var(--ease) 40ms both}
.name{animation:rise 520ms var(--ease) 100ms both}
.epigraph{animation:rise 520ms var(--ease) 140ms both}
.links{animation:rise 520ms var(--ease) 180ms both}
.seal-wrap{animation:stamp-in 560ms var(--ease) 260ms both}
.colophon{animation:rise 480ms var(--ease) 320ms both}

@media (prefers-reduced-motion:reduce){
  .masthead,.name,.epigraph,.links,.seal-wrap,.colophon{animation:none}
  .link,.link-icon,.link-arrow{transition:none}
  .link:hover .link-arrow{transform:none}
}

@media (forced-colors:active){
  .link{border-color:CanvasText}
  .link:focus-visible{outline-color:Highlight}
}
</style>
</head>
