<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#D8FF36" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>Nondiat — личные профили</title>
<meta name="description" content="Telegram, TikTok и Steam — профили Nondiat.">
<!-- Design method: unslop by Damir Sokolovsky, CC BY 4.0 — https://github.com/heydamir/unslop -->
<style>
:root{
  color-scheme:light;
  --page:#D8FF36;
  --poster:#171922;
  --paper:#EFF0E8;
  --ink:#171922;
  --light-ink:#F5F4EE;
  --muted:#B6BAC8;
  --acid:#D8FF36;
  --blue:#4E5DFF;
  --coral:#FF6A51;
  --rule:rgba(23,25,34,.18);
  --light-rule:rgba(245,244,238,.18);
  --focus:#4352F2;
  --display:Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',monospace;
}
@media(prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#111318;
    --poster:#1B1D26;
    --paper:#D8FF36;
    --ink:#171922;
    --light-ink:#F5F4EE;
    --muted:#BFC3CE;
    --acid:#D8FF36;
    --blue:#858CFF;
    --coral:#FF795F;
    --rule:rgba(23,25,34,.2);
    --light-rule:rgba(245,244,238,.16);
    --focus:#6F79FF;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  min-height:100svh;
  margin:0;
  padding:clamp(12px,2.5vw,34px);
  background:var(--page);
  color:var(--light-ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--coral);color:var(--ink)}
.poster{
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(360px,.82fr);
  grid-template-rows:auto 1fr auto;
  width:min(1320px,100%);
  min-height:min(820px,calc(100vh - clamp(24px,5vw,68px)));
  min-height:min(820px,calc(100svh - clamp(24px,5vw,68px)));
  margin:0 auto;
  overflow:hidden;
  background:var(--poster);
  border:1px solid rgba(23,25,34,.12);
}
.masthead{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  min-height:72px;
  padding:17px clamp(22px,4vw,52px);
  border-bottom:1px solid var(--light-rule);
  color:var(--muted);
  font-size:12px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:28px;height:22px;flex:0 0 auto;color:var(--acid)}
.brand-name{overflow-wrap:anywhere}
.masthead-note{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.identity{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
  padding:clamp(30px,5.2vw,70px);
}
.eyebrow{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 25px;
  color:var(--acid);
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.eyebrow::before{content:"";width:24px;height:2px;background:var(--coral)}
h1{
  width:max-content;
  max-width:100%;
  margin:0;
  color:var(--light-ink);
  font-family:var(--display);
  font-size:clamp(76px,12vw,164px);
  font-stretch:condensed;
  font-weight:900;
  line-height:.78;
  letter-spacing:-.052em;
}
.epigraph{
  margin:24px 0 0;
  color:var(--coral);
  font-size:clamp(25px,3.2vw,40px);
  font-weight:750;
  line-height:1;
  letter-spacing:-.045em;
}
.signal{
  width:min(620px,100%);
  margin:clamp(38px,6vw,82px) 0 0;
}
.signal svg{display:block;width:100%;height:auto;overflow:visible}
.wave-primary{fill:none;stroke:var(--acid);stroke-width:5;stroke-linecap:square;stroke-linejoin:bevel}
.wave-secondary{fill:none;stroke:var(--coral);stroke-width:2;stroke-linecap:square;opacity:.9}
.signal-baseline{fill:none;stroke:rgba(245,244,238,.24);stroke-width:1;stroke-dasharray:2 9}
.signal-caption{
  display:flex;
  justify-content:space-between;
  gap:14px;
  margin-top:11px;
  color:var(--muted);
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.profiles{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
  padding:clamp(24px,3.8vw,50px);
  background:var(--paper);
  color:var(--ink);
}
.profiles-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin:0 0 18px;
  color:var(--ink);
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.profiles-heading span:last-child{color:var(--blue);font-variant-numeric:tabular-nums}
.profile-list{display:grid;border-top:1px solid var(--rule)}
.profile{
  display:grid;
  grid-template-columns:54px minmax(0,1fr) 22px;
  align-items:center;
  gap:12px;
  min-height:112px;
  padding:15px 8px 15px 0;
  border-bottom:1px solid var(--rule);
  color:var(--ink);
  text-decoration:none;
  transition:background-color 150ms ease,color 150ms ease,padding 150ms ease;
  -webkit-tap-highlight-color:transparent;
}
.profile-index{
  color:var(--blue);
  font-family:var(--mono);
  font-size:13px;
  font-variant-numeric:tabular-nums;
}
.profile-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.profile-name{
  font-size:clamp(18px,2vw,24px);
  font-weight:760;
  line-height:1.15;
  letter-spacing:-.035em;
}
.profile-handle{
  color:rgba(23,25,34,.68);
  font-family:var(--mono);
  font-size:12px;
  overflow-wrap:anywhere;
}
.profile-arrow{width:18px;height:18px;color:var(--blue);transition:transform 150ms ease}
.profile:hover{padding-left:10px;background:var(--coral)}
.profile:hover .profile-index,.profile:hover .profile-arrow{color:var(--ink)}
.profile:hover .profile-handle{color:rgba(23,25,34,.78)}
.profile:hover .profile-arrow{transform:translate(2px,-2px)}
.profile:focus-visible{position:relative;z-index:1;outline:3px solid var(--focus);outline-offset:3px}
.colophon{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  min-height:56px;
  padding:13px clamp(22px,4vw,52px);
  border-top:1px solid var(--light-rule);
  color:var(--muted);
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.045em;
}
.colophon p{margin:0}
@media(max-width:820px){
  body{padding:10px}
  .poster{
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto auto auto;
    min-height:calc(100svh - 20px);
  }
  .masthead{min-height:62px;padding:14px 22px}
  .identity{padding:42px clamp(22px,7vw,48px) 30px}
  h1{font-size:clamp(76px,17vw,136px)}
  .signal{margin-top:42px}
  .profiles{padding:28px clamp(22px,7vw,48px) 36px}
  .profile{min-height:88px}
  .colophon{min-height:50px;padding:12px 22px}
}
@media(max-width:420px){
  .masthead{gap:10px;font-size:11px}
  .masthead-note{font-size:9px}
  .identity{padding-top:36px}
  .eyebrow{margin-bottom:22px}
  h1{font-size:clamp(70px,18vw,96px)}
  .epigraph{margin-top:19px}
  .signal{margin-top:36px}
  .profile{grid-template-columns:42px minmax(0,1fr) 18px;gap:9px;min-height:78px}
  .profile-name{font-size:18px}
  .profile-handle{font-size:11px}
  .colophon{font-size:9px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
  .profile:hover .profile-arrow{transform:none}
}
@media(forced-colors:active){
  .poster,.profiles,.profile{border-color:CanvasText}
  .profile:focus-visible{outline-color:Highlight}
}
</style>
</head>
<body>
<main class="poster">
  <header class="masthead">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 36 24" aria-hidden="true" focusable="false">
        <path d="M1 12h7l3-7 5 14 4-18 5 21 4-10h6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="square" stroke-linejoin="bevel"/>
      </svg>
      <span class="brand-name">nondiat.runs-on.dev</span>
    </div>
    <p class="masthead-note">Личный каталог</p>
  </header>

  <section class="identity" aria-label="Nondiat">

    <h1>Nondiat</h1>

    <figure class="signal" aria-hidden="true">
      <svg viewBox="0 0 660 142" focusable="false">

        <path class="wave-primary" d="M0 71H68l15-24 15 49 20-81 22 108 18-52 18 0h45l18-27 18 54 19-82 22 105 17-49h47l17-20 17 41 22-64 22 44h44l18-31 22 63 17-42h47l16-22 20 37h70"/>
      </svg>

    <div class="profile-list">
      <a class="profile" href="https://t.me/Nondiat" target="_blank" rel="noopener noreferrer">
        <span class="profile-index">01</span>
        <span class="profile-copy"><span class="profile-name">Telegram</span><span class="profile-handle">@Nondiat</span></span>
        <svg class="profile-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M7 6h11v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
      </a>
      <a class="profile" href="https://www.tiktok.com/@nondiat_prime" target="_blank" rel="noopener noreferrer">
        <span class="profile-index">02</span>
        <span class="profile-copy"><span class="profile-name">TikTok</span><span class="profile-handle">@nondiat_prime</span></span>
        <svg class="profile-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M7 6h11v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
      </a>
      <a class="profile" href="https://steamcommunity.com/id/nondiat/" target="_blank" rel="noopener noreferrer">
        <span class="profile-index">03</span>
        <span class="profile-copy"><span class="profile-name">Steam</span><span class="profile-handle">nondiat</span></span>
        <svg class="profile-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M7 6h11v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
      </a>
    </div>
  </nav>

  <footer class="colophon"><p>nondiat.runs-on.dev</p><p>2026</p></footer>
</main>
</body>
</html>
