<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F2E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161C18" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>Nondiat — ботанический каталог профилей</title>
<meta name="description" content="Личный каталог Nondiat в ботанической манере. Telegram, TikTok и Steam.">
<!-- Design method: unslop by Damir Sokolovsky, CC BY 4.0 — https://github.com/heydamir/unslop -->
<style>
:root{
  color-scheme:light;
  --ground:#E7E9DF;
  --sheet:#F4F2E8;
  --ink:#202821;
  --ink-2:#536057;
  --ink-3:#68736A;
  --berry:#6B2D4F;
  --leaf:#526D57;
  --rule:rgba(32,40,33,.14);
  --rule-strong:rgba(32,40,33,.28);
  --wash:rgba(32,40,33,.045);
  --focus:#6B2D4F;
  --folio-edge:rgba(32,40,33,.12);
  --serif:Georgia,'Times New Roman','Noto Serif',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --ground:#141A16;
    --sheet:#1D2620;
    --ink:#EDF1E8;
    --ink-2:#C2CBC0;
    --ink-3:#A6B0A5;
    --berry:#D7A0B8;
    --leaf:#A2B99F;
    --rule:rgba(237,241,232,.12);
    --rule-strong:rgba(237,241,232,.27);
    --wash:rgba(237,241,232,.05);
    --focus:#E0A8C0;
    --folio-edge:rgba(237,241,232,.10);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  padding:clamp(12px,3vw,36px);
  min-height:100vh;
  min-height:100svh;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--berry);color:var(--sheet)}
a{color:inherit}
.folio{
  display:flex;
  flex-direction:column;
  width:min(1360px,100%);
  min-height:calc(100vh - clamp(24px,6vw,72px));
  min-height:calc(100svh - clamp(24px,6vw,72px));
  margin:0 auto;
  padding:clamp(22px,4vw,52px) clamp(22px,5vw,68px) clamp(18px,3vw,32px);
  background:var(--sheet);
  border:1px solid var(--folio-edge);
}
.topline,.colophon{display:flex;align-items:center;justify-content:space-between;gap:20px}
.topline{min-height:24px;color:var(--ink-3);font-size:12px;letter-spacing:.02em}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:20px;height:20px;color:var(--berry)}
.topline-note{margin:0}
.spread{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(330px,.86fr);
  align-items:center;
  gap:clamp(48px,8vw,116px);
  width:100%;
  max-width:1120px;
  margin:auto;
  padding:48px 0;
}
.identity{min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 18px;color:var(--ink-2);font-size:13px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--berry)}
h1{
  margin:0;
  font-family:var(--serif);
  font-size:clamp(68px,9vw,128px);
  font-weight:400;
  line-height:.9;
  letter-spacing:-.045em;
}
.epigraph{margin:20px 0 0;font-family:var(--serif);font-size:clamp(22px,2.3vw,30px);line-height:1.2;color:var(--ink-2)}
.specimen{width:min(440px,100%);margin:52px 0 0}
.specimen svg{display:block;width:100%;height:auto;overflow:visible}
.vine{fill:none;stroke:var(--leaf);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.leaf{fill:var(--ground);stroke:var(--leaf);stroke-width:2}
.berry{fill:var(--sheet);stroke:var(--berry);stroke-width:2.3}
.berry-hatch{fill:none;stroke:var(--berry);stroke-width:1.2;stroke-linecap:round;opacity:.6}
.figure-note{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 0;padding-top:10px;border-top:1px solid var(--rule);color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.015em}
.profiles{position:relative;display:grid;align-self:center}
.profiles::before{content:"";position:absolute;left:40px;top:47px;bottom:47px;width:1px;background:var(--leaf);opacity:.65}
.profile{
  position:relative;
  display:grid;
  grid-template-columns:80px minmax(0,1fr) 18px;
  align-items:center;
  gap:12px;
  min-height:96px;
  padding:14px 8px 14px 0;
  border-top:1px solid var(--rule-strong);
  text-decoration:none;
  transition:background-color 160ms ease,color 160ms ease;
  -webkit-tap-highlight-color:transparent;
}
.profile:last-child{border-bottom:1px solid var(--rule-strong)}
.profile::before{content:"";position:absolute;left:35px;top:50%;width:11px;height:11px;border:2px solid var(--sheet);border-radius:50%;background:var(--berry);outline:1px solid var(--berry);transform:translateY(-50%)}
.profile:hover{background:var(--wash)}
.profile:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.profile-index{color:var(--ink-3);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.profile-icon{display:block;width:20px;height:20px;color:var(--ink-2)}
.profile-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.profile-name{font-size:19px;line-height:1.3;font-weight:500}
.profile-handle{color:var(--ink-2);font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.arrow{width:16px;height:16px;color:var(--ink-3);transition:transform 160ms ease,color 160ms ease}
.profile:hover .arrow{color:var(--berry);transform:translate(2px,-2px)}
.colophon{padding-top:14px;border-top:1px solid var(--rule);color:var(--ink-3);font-size:12px}
.colophon p{margin:0}
@media (max-width:760px){
  body{padding:10px}
  .folio{min-height:calc(100svh - 20px);padding:22px 22px 16px}
  .topline{gap:12px;font-size:11px}
  .spread{grid-template-columns:minmax(0,1fr);gap:36px;padding:44px 0 40px}
  .eyebrow{margin-bottom:14px}
  h1{font-size:clamp(64px,18vw,92px)}
  .epigraph{margin-top:14px;font-size:24px}
  .specimen{width:min(330px,82%);margin:26px auto 0}
  .profile{grid-template-columns:72px minmax(0,1fr) 18px;min-height:78px;gap:8px;padding:10px 4px 10px 0}
  .profiles::before{left:36px;top:39px;bottom:39px}
  .profile::before{left:31px}
  .profile-name{font-size:17px}
  .profile-handle{font-size:12.5px}
}
@media (max-width:360px){
  .folio{padding-inline:16px}
  .spread{padding-top:34px}
  .profile{grid-template-columns:64px minmax(0,1fr) 16px;gap:6px}
  .profiles::before{left:32px}
  .profile::before{left:27px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
  .profile:hover .arrow{transform:none}
}
@media (forced-colors:active){
  .profile{border-color:CanvasText}
  .profile:focus-visible{outline-color:Highlight}
}
</style>
</head>
