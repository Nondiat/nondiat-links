<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F7F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1214" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>Nondiat — профили и контакты</title>
<meta name="description" content="Личная страница Nondiat со ссылками на Telegram, TikTok и Steam.">
<!-- Design method: unslop by Damir Sokolovsky, CC BY 4.0 — https://github.com/heydamir/unslop -->
<style>
:root{
  color-scheme:light;
  --page:#F5F7F8;
  --surface:#FFFFFF;
  --raised:#EEF2F3;
  --ink:#182124;
  --secondary:#4F5B5F;
  --muted:#6B777B;
  --accent:#285C72;
  --line:rgba(24,33,36,.11);
  --focus:#285C72;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',monospace;
}
@media(prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#0E1214;
    --surface:#151B1E;
    --raised:#1C2427;
    --ink:#EEF2F1;
    --secondary:#BFCACB;
    --muted:#9BA8AA;
    --accent:#8FC2D2;
    --line:rgba(238,242,241,.1);
    --focus:#9BD0E1;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  min-height:100svh;
  margin:0;
  padding:24px;
  background:var(--page);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--accent);color:var(--surface)}
a{color:inherit}
.page{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:64px 1fr 48px;
  width:min(1120px,100%);
  min-height:min(640px,calc(100vh - 48px));
  min-height:min(640px,calc(100svh - 48px));
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
}
.masthead,.footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:0 32px;
  color:var(--muted);
  font-size:13px;
}
.masthead{border-bottom:1px solid var(--line)}
.masthead p,.footer p{margin:0}
.masthead-site{color:var(--secondary)}
.spread{
  display:grid;
  grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);
  align-items:center;
  gap:48px;
  padding:48px 56px;
}
.identity{min-width:0}
.eyebrow{margin:0 0 20px;color:var(--secondary);font-size:14px}
h1{
  margin:0;
  color:var(--ink);
  font-size:clamp(56px,7vw,72px);
  font-weight:500;
  line-height:1.06;
  letter-spacing:-.03em;
  overflow-wrap:anywhere;
}
.epigraph{margin:16px 0 0;color:var(--secondary);font-size:20px;line-height:1.4}
.profiles{min-width:0}
.profiles-heading{margin:0 0 16px;color:var(--secondary);font-size:14px;font-weight:500}
.profile-list{position:relative;display:grid;border-top:1px solid var(--line)}
.profile-list::before{
  content:"";
  position:absolute;
  top:44px;
  bottom:44px;
  left:4px;
  width:1px;
  background:var(--accent);
}
.profile{
  position:relative;
  display:grid;
  grid-template-columns:52px minmax(0,1fr) 20px;
  align-items:center;
  gap:12px;
  min-height:88px;
  padding:12px 8px 12px 0;
  border-bottom:1px solid var(--line);
  border-radius:8px;
  text-decoration:none;
  transition:background-color 140ms ease,color 140ms ease;
  -webkit-tap-highlight-color:transparent;
}
.route-step{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.route-dot{
  flex:0 0 auto;
  width:10px;
  height:10px;
  border:1.5px solid var(--accent);
  border-radius:50%;
  background:var(--surface);
}
.route-index{color:var(--muted);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.profile-copy{display:flex;flex-direction:column;gap:4px;min-width:0}
.profile-name{font-size:18px;font-weight:500;line-height:1.25}
.profile-handle{color:var(--secondary);font-size:14px;overflow-wrap:anywhere}
.profile-arrow{width:18px;height:18px;color:var(--muted);transition:color 140ms ease,transform 140ms ease}
.profile:hover{background:var(--raised)}
.profile:hover .profile-arrow{color:var(--accent);transform:translate(2px,-2px)}
.profile:focus-visible{z-index:2;outline:2px solid var(--focus);outline-offset:2px}
.footer{border-top:1px solid var(--line);font-size:12px}
@media(max-width:760px){
  body{align-items:flex-start;padding:16px}
  .page{
    grid-template-rows:60px auto 48px;
    min-height:calc(100svh - 32px);
  }
  .masthead,.footer{padding-inline:24px}
  .spread{grid-template-columns:minmax(0,1fr);gap:40px;padding:40px 32px}
  .eyebrow{margin-bottom:16px}
  h1{font-size:clamp(52px,13vw,68px)}
  .profiles-heading{margin-bottom:12px}
  .profile{min-height:80px}
  .profile-list::before{top:40px;bottom:40px}
}
@media(max-width:400px){
  body{padding:12px}
  .page{grid-template-rows:56px auto 44px;min-height:calc(100svh - 24px)}
  .masthead,.footer{padding-inline:20px}
  .masthead{font-size:12px}
  .spread{gap:32px;padding:32px 20px}
  h1{font-size:48px}
  .profile{grid-template-columns:44px minmax(0,1fr) 18px;gap:8px;min-height:76px}
  .route-step{gap:8px}
  .route-dot{width:9px;height:9px}
  .profile-name{font-size:16px}
  .profile-handle{font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}
@media(forced-colors:active){
  .page,.profile{border-color:CanvasText}
  .profile:focus-visible{outline-color:Highlight}
}
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <span class="masthead-site">nondiat.runs-on.dev</span>
    <p>Личный каталог</p>
  </header>
  <section class="spread" aria-label="Профили Nondiat">
    <div class="identity">
      <p class="eyebrow">Личная страница</p>
      <h1>Nondiat</h1>
      <p class="epigraph">Гойда</p>
    </div>
    <nav class="profiles" aria-label="Профили">
      <h2 class="profiles-heading">Профили</h2>
      <div class="profile-list">
        <a class="profile" href="https://t.me/Nondiat" target="_blank" rel="noopener noreferrer">
          <span class="route-step"><span class="route-dot" aria-hidden="true"></span><span class="route-index">01</span></span>
          <span class="profile-copy"><span class="profile-name">Telegram</span><span class="profile-handle">@Nondiat</span></span>
          <svg class="profile-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M7 6h11v11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="profile" href="https://www.tiktok.com/@nondiat_prime" target="_blank" rel="noopener noreferrer">
          <span class="route-step"><span class="route-dot" aria-hidden="true"></span><span class="route-index">02</span></span>
          <span class="profile-copy"><span class="profile-name">TikTok</span><span class="profile-handle">@nondiat_prime</span></span>
          <svg class="profile-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M7 6h11v11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="profile" href="https://steamcommunity.com/id/nondiat/" target="_blank" rel="noopener noreferrer">
          <span class="route-step"><span class="route-dot" aria-hidden="true"></span><span class="route-index">03</span></span>
          <span class="profile-copy"><span class="profile-name">Steam</span><span class="profile-handle">nondiat</span></span>
          <svg class="profile-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M7 6h11v11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </nav>
  </section>
  <footer class="footer"><p>Профили и контакты</p><p>2026</p></footer>
</main>
</body>
</html>
